[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostshell"
version = "0.1.0"
description = "A spooky, AI-powered Linux terminal companion for Hacktoberfest 2026: Ghost in the Machine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "GhostShell Team"}
]
dependencies = [
    "rich>=13.7.0",
    "typer>=0.9.0",
    "ollama>=0.4.0",
    "prompt-toolkit>=3.0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
ghostshell = "ghostshell.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["ghostshell*"]
